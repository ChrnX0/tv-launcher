# Compila o launcher no GitHub e, a cada push na main, publica o APK em "Releases" (04/11/2026).
# A TV vai baixar daqui sozinha (passo seguinte: o atualizador dentro do launcher).
#
# - Pull request: só compila, para conferir que o build passa. Nunca assina com a chave de verdade nem publica.
# - Push na main: compila, assina com o segredo ASSINATURA_KEYSTORE_B64 e publica um Release com o APK e o SHA-256.
#   Sem o segredo, só compila (e avisa), para não publicar um APK que a TV recusaria.
#
# Segredo necessário (Settings > Secrets and variables > Actions): ASSINATURA_KEYSTORE_B64 = a chave PÚBLICA do
# projeto em base64 (+ ASSINATURA_SENHA / ASSINATURA_ALIAS se não forem os padrões). NUNCA o debug.keystore do Dell:
# decisão do Paulo (04/11/2026, opção A) — a TV da Sala fica com a chave do Dell e é atualizada pelo Dell; quem tivesse
# essa chave poderia assinar uma "atualização" aceita por cima do Device Owner. O Release daqui é para instalação nova.
name: Build e Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # criar o Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # O runner já traz o Android SDK em $ANDROID_HOME (o setup-android@v3 quebrava ao pedir o pacote "tools", que
      # não existe mais). Só faltam as mesmas versões do Dell (build.gradle.kts da raiz e shizuku/api/rish):
      # SDK 36, NDK 29, CMake 3.31+.
      - name: Componentes do Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v5

      - name: Chave de assinatura
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ASSINATURA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinatura.keystore"
            echo "ASSINATURA_ARQUIVO=$RUNNER_TEMP/assinatura.keystore" >> "$GITHUB_ENV"
            echo "TEM_CHAVE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o segredo ASSINATURA_KEYSTORE_B64: compila, mas não publica Release."
          fi

      - name: Compilar o release
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
          ASSINATURA_ALIAS: ${{ secrets.ASSINATURA_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Versão e SHA-256
        id: info
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          CODIGO=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          sha256sum "$APK" | cut -d' ' -f1 > app-release.apk.sha256
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODIGO  tamanho=$(stat -c%s "$APK") bytes  sha256=$(cat app-release.apk.sha256)"

      - uses: actions/upload-artifact@v5
        with:
          name: tv-launcher-${{ steps.info.outputs.codigo }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256

      - name: Publicar o Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TEM_CHAVE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.info.outputs.codigo }}
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
          mv app-release.apk.sha256 tv-launcher.apk.sha256
          gh release create "v$V" tv-launcher.apk tv-launcher.apk.sha256 \
            --title "tv-launcher $V" \
            --notes "Build automático de ${GITHUB_SHA::7}. versionCode $V." \
            --target "$GITHUB_SHA"
